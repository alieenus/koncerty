server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;   # po kupnie domeny wpisz tu np. koncerty.twojadomena.pl

    root /var/www/koncerty;
    index index.html;

    location /data/ {
        add_header Cache-Control "no-cache";
    }
    location ~ /\. { deny all; }

    gzip on;
    gzip_types application/json text/css application/javascript;
}
